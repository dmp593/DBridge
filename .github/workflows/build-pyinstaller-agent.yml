name: Build Windows EXE with PyInstaller

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

jobs:
  build-windows-exe:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build EXE with PyInstaller (console)
        run: |
          pyinstaller --onefile --console agent.py

      - name: Upload built EXE as artifact
        uses: actions/upload-artifact@v7
        with:
          name: agent-windows-exe
          path: dist/agent.exe
          if-no-files-found: error

      - name: Publish EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: dist/agent.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
